<body>
     <h1>Planta Baixa - IFBA Ilhéus</h1>
  <p>Clique na sala para dar zoom:</p>

    <!-- Painel Lateral Simples -->
    <div id="painel">

      <br>
      <button onclick="resetarZoom()">Visão Geral</button>
    </div>
  </div>
